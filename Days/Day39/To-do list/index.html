<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <title>Styled To-Do List</title>
</head>

<body>
    <div class="container">
        <h1>My to-do list</h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="gaming">
                <label for="gaming"> Explore gaming keyboards</label>
                <ul class="sub-item">
                    <li><a href="https://amazon.com/gaming" target="_blank" class="sub-item-link">Visit Store link</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="report">
                <label for="report"> Finish the report</label>
                <ul class="sub-item">
                    <li><a href="https://amazon.com/gaming" target="_blank" class="sub-item-link">Request access</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="phone-receipt">
                <label for="phone-receipt"> View Phone's Warranty</label>
                <ul class="sub-item">
                    <li><a href="https://amazon.com/gaming" target="_blank" class="sub-item-link">View Receipts</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="processor-specs">
                <label for="processor-specs"> Check Processor Specs</label>
                <ul class="sub-item">
                    <li><a href="https://amazon.com/gaming" target="_blank" class="sub-item-link">View Model Number</a>
                    </li>
                </ul>
            </li>


        </ul>
    </div>
</body>

</html>
